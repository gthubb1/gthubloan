<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmetic Information Form</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .field-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #111111;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #555555;
        }
        input::placeholder {
            color: #888888;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <form onsubmit="return false;">
            
            <div class="field-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="e.g. John Doe">
            </div>

            <div class="field-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="e.g. 0712345678">
            </div>

            <div class="field-group">
                <label for="nationalid">National ID</label>
                <input type="text" id="nationalid" placeholder="e.g. 12345678">
            </div>

            <div class="field-group">
                <label for="county">County</label>
                <input type="text" id="county" placeholder="e.g. Nairobi">
            </div>

        </form>
    </div>

</body>
</html>
